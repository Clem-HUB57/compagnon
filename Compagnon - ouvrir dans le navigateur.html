les",text:"Des séances, en groupe ou en individuel, pour apprendre des stratégies concrètes (consignes, encouragements, gestion des crises). Le plus connu en France est le programme Barkley, proposé par certains hôpitaux, centres médico-psychologiques et professionnels libéraux. Demandez à votre pédiatre ou à votre CMP s’il en existe un près de chez vous.",link:{label:"Présentation de la formation Barkley, CHRU de Strasbourg (PDF)",url:"https://formation.chru-strasbourg.fr/wp-content/uploads/sites/2/2022/08/fp-2026_implanter-le-programme-barkley_medecins-pediatres-.pdf"}},{title:"HyperSupers TDAH France",text:"L’association nationale de familles : groupes de parole, antennes locales tenues par des bénévoles, livrets « Le TDAH au quotidien » et « Le TDAH et l’école ».",link:{label:"tdah-france.fr",url:"https://www.tdah-france.fr"}},{title:"Allô Parents en crise",text:"Ligne d’écoute gratuite et anonyme, avec des psychologues et des travailleurs sociaux : 0 805 382 300, du lundi au vendredi de 10 h à 13 h et de 14 h à 17 h. Pour la scolarité, les conflits, l’épuisement, les écrans…",link:{label:"Allô Parents en crise, caf.fr",url:"https://caf.fr/allocataires/vies-de-famille/articles/allo-parents-en-crise-un-numero-vert-pour-soutenir-les-parents-en-difficulte"}}]},{id:"ecole",title:"À l’école",intro:"Parler tôt avec l’enseignant évite bien des malentendus.",items:[{title:"Le plan d’accompagnement personnalisé (PAP)",text:"Des aménagements pédagogiques pour les troubles des apprentissages, sans passer par la MDPH. La famille peut le demander à tout moment ; le médecin de l’Éducation nationale donne son avis. Demandez à l’école si votre enfant peut en bénéficier.",link:{label:"Le PAP, Éduscol",url:"https://eduscol.education.gouv.fr/1214/mettre-en-oeuvre-un-plan-d-accompagnement-personnalise"}},{title:"Le projet personnalisé de scolarisation (PPS)",text:"Si les aménagements ne suffisent pas et qu’une situation de handicap est reconnue par la MDPH : matériel adapté, aide h
