 le cahier","Pose-le sur ton bureau.","Ouvre ton sac et cherche la couleur du cahier de cette matière.","Ouvre seulement ton sac."],["Ouvre à la bonne page","Le cahier de textes t’indique laquelle.","Cherche la date ou le numéro de l’exercice, puis ouvre le cahier.","Ouvre le cahier, n’importe où pour l’instant."],["Lis la première consigne","Juste la première.","Pose ton doigt sous le premier mot et lis la phrase jusqu’au point.","Lis seulement les trois premiers mots."],["Essaie la première question","Essayer, c’est déjà gagner, même si ce n’est pas parfait.","Écris ce que tu sais, même un seul mot ou un seul chiffre.","Prends ton crayon et écris la date ou ton prénom.",15],["Demande de l’aide si tu bloques","Demander de l’aide est une vraie stratégie.","Va voir un adulte avec ton cahier et montre-lui ce qui bloque.","Dis « je bloque » à quelqu’un. C’est tout."]])},{id:"ranger-activite",title:"Ranger après une activité",description:"Une petite zone à la fois, et tu décides quand t’arrêter.",illustration:"ranger",estimatedMinutes:10,category:"maison",isCustom:!1,isDemo:!0,trigger:"Quand j’ai fini de jouer",steps:Pt("ranger-activite",[["Choisis une petite zone","Ton bureau, un coin du tapis, une étagère…","Montre du doigt un coin de la pièce : c’est ta zone.","Choisis juste une zone de la taille d’une serviette."],["Ramasse les objets au sol","Seulement dans ta zone.","Commence par le plus gros objet et pose-le sur ton lit ou ton bureau.","Ramasse un seul objet."],["Range les objets à leur place","Chaque chose a sa maison.","Prends un objet et demande-toi : « où est sa maison ? »","Range trois objets, pas plus."],["Mets à la poubelle ce qui doit l’être","Papiers, emballages…","Prends les papiers froissés et va jusqu’à la poubelle.","Jette un seul papier."],["Regarde ce qui reste","Prends une seconde pour observer.","Recule de deux pas et regarde ta zone.","Regarde ta zone pendant trois secondes."],["Décide si tu continues ou si tu t’arrêtes","Les deux sont de bons c
